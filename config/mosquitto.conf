# Mosquitto - Configuración para taller local
# Archivo: config/mosquitto.conf
#
# Uso: mosquitto -c config/mosquitto.conf
# -----------------------------------------------

# Puerto estándar MQTT
listener 1883

# Sin autenticación (modo taller, red local controlada)
allow_anonymous true

# Logging legible para el taller
log_type all
log_dest stdout

# Persistencia de mensajes entre reinicios (opcional para taller)
persistence false
