# ======================================================
# Configuración compartida del taller
# Documentación de referencia para todos los componentes
# ======================================================

[network]
# IP del servidor backend (PC del instructor)
# Cambiar según la red local del taller
server_ip = 192.168.1.71
server_port = 8000

[mqtt]
broker_host = 192.168.1.71
# Con mDNS: broker_host = mqtt.local
broker_port = 1883

[sensor]
# Tamaño de ventana de muestras (debe ser igual en firmware y backend)
window_size = 50
sample_rate_hz = 100
# Tiempo por ventana: window_size / sample_rate = 0.5 segundos

[topics]
# Patrón: sensors/{device_id}/raw
raw_data     = sensors/{device_id}/raw
status       = sensors/{device_id}/status
prediction   = predictions/{device_id}/result
