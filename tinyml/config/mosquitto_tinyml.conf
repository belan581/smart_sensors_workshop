# ============================================================
#  mosquitto_tinyml.conf  —  Broker para inferencia TinyML
#
#  Recibe mensajes del ESP32-S3 en:
#      sensors/esp32s3_001/drinking
#
#  Y los reenvía (bridge) al topic que escucha la API FastAPI:
#      inference/drinking
#
#  Uso: mosquitto -c config/mosquitto_tinyml.conf -v
# ============================================================

# ── Puerto MQTT ─────────────────────────────────────────────
listener 1883

# ── Acceso anónimo (red local del taller) ───────────────────
allow_anonymous true

# ── Logging completo en consola ─────────────────────────────
log_type all
log_dest stdout

# ── Persistencia desactivada (taller) ───────────────────────
persistence false

# ── Bridge hacia la API FastAPI ─────────────────────────────
# El bridge suscribe el topic del microcontrolador y reenvía
# el mensaje al broker local en el topic que lee la API.
#
# Como la API corre en el mismo host, el bridge apunta a
# localhost:1883 → solo hace una traducción de topic.
#
# Si la API está en otro host, cambia "address localhost:1883"
# por la IP correspondiente.

connection bridge_to_fastapi
address localhost:1883
topic sensors/+/drinking in 0 "" inference/
#
# Resultado del reenvío:
#   sensors/esp32s3_001/drinking  →  inference/sensors/esp32s3_001/drinking
#
# La API FastAPI debe suscribirse a: inference/sensors/+/drinking
